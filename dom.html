      <li>Item 2</li>

  <section>

  <section>

    <form onsubmit="return false">
      <input type="text" id="name" placeholder="Name"><br>
      <input type="email" id="email" placeholder="Email">
    </form>
    <p>Name: <span id="outName"></span></p>
