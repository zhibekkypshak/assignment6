<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<nav>

<main>
  <section>
    <h2>Task 2. Visibility Methods</h2>
    <p id="para">This paragraph can be hidden, shown or toggled.</p>
    <button id="hideBtn">Hide</button>
    <button id="showBtn">Show</button>
    <button id="toggleBtn">Toggle</button>
  </section>

  <section>
    <h2>Task 3. Fade Methods</h2>
    <img id="fadeImg" src="https://picsum.photos/id/237/300/200" alt="Dog">
    <button id="fadeInBtn">fadeIn</button>
    <button id="fadeOutBtn">fadeOut</button>
    <button id="fadeToggleBtn">fadeToggle</button>
  </section>

  <section>
    <h2>Task 4. Slide Methods</h2>
    <button id="slideUpBtn">slideUp</button>
    <button id="slideDownBtn">slideDown</button>
    <button id="slideToggleBtn">slideToggle</button>
    <div id="panel">
      <h3>Collapsible panel</h3>
      <p>This content slides up and down.</p>
    </div>
  </section>
</main>
</body>
</html>
